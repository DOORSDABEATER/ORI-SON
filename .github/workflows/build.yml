
name: Build ORISON Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ORISON
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Upload ORISON JAR
        uses: actions/upload-artifact@v4
        with:
          name: ORISON-Plugin-1.0
          path: build/libs/*.jar
          if-no-files-found: error
          
