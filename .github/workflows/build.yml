
name: Build ORISON Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract ORISON source
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q orison-milestone9-src.zip -d source
          ls source/orison

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build ORISON
        run: |
          cd source/orison
          gradle clean build --no-daemon

      - name: Upload ORISON JAR
        uses: actions/upload-artifact@v4
        with:
          name: ORISON-Milestone9
          path: source/orison/build/libs/*.jar
          if-no-files-found: error
          
